<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Watch YouTube videos on Meta Ray-Ban Display">
<meta name="mrbd-web-app-capable" content="yes">
<title>LensTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Additive display: pure black renders as see-through, so the page background stays #000. */
  :root {
    --bg: #000;
    --ink: #F2F5FF;
    --dim: #8E9AB8;
    --focus: #FFC46B;
    --panel: #10162A;
    --err: #FF8A80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; padding: 4vmin; gap: 3vmin; }
  .screen.active { display: flex; }
  h1 { margin: 0; font-size: 6vmin; font-weight: 700; }
  p { margin: 0; }
  .hint { color: var(--dim); font-size: 4vmin; line-height: 1.35; }
  .row { display: flex; gap: 2vmin; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 4.5vmin; color: var(--ink);
    background: var(--panel); border: 2px solid transparent; border-radius: 3vmin; padding: 2.5vmin 3vmin; }
  button { font: inherit; font-size: 4.5vmin; font-weight: 700; color: var(--ink); background: var(--panel);
    border: 2px solid transparent; border-radius: 3vmin; padding: 2.5vmin 3.5vmin; cursor: pointer; }
  button:focus-visible, input:focus-visible, button:focus, input:focus { outline: none; border-color: var(--focus); }
  .list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2vmin; }
  .item { display: flex; align-items: center; gap: 3vmin; text-align: left; width: 100%; padding: 2vmin; }
  .item img { width: 24vmin; aspect-ratio: 16/9; object-fit: cover; border-radius: 2vmin; flex: none; }
  .item span { font-size: 4vmin; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .tabs { display: flex; gap: 2vmin; }
  .tabs button[aria-pressed=true] { color: var(--bg); background: var(--ink); }
  #player-screen { padding: 0; gap: 0; }
  .frame { width: 100%; aspect-ratio: 16/9; flex: none; background: #000; }
  .frame > * { width: 100%; height: 100%; display: block; }
  .controls { display: flex; justify-content: center; gap: 2vmin; padding: 3vmin; }
  .controls button { min-width: 15vmin; }
  #now-title { padding: 0 4vmin; font-size: 4vmin; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg { font-size: 4vmin; color: var(--err); }
  @media (prefers-reduced-motion: no-preference) { button { transition: border-color .12s; } }
</style>
</head>
<body>

<section id="home" class="screen active" aria-label="Home">
  <h1>LensTube</h1>
  <div class="row">
    <input id="query" type="text" placeholder="Search or paste a link" aria-label="Search YouTube or paste a video link">
    <button id="go">Go</button>
  </div>
  <div class="tabs" role="group" aria-label="Lists">
    <button id="tab-results" aria-pressed="true">Results</button>
    <button id="tab-saved" aria-pressed="false">Saved</button>
  </div>
  <p id="status" class="hint"></p>
  <div id="list" class="list"></div>
</section>

<section id="player-screen" class="screen" aria-label="Player">
  <div class="frame"><div id="yt"></div></div>
  <p id="now-title"></p>
  <div class="controls">
    <button id="back10" aria-label="Back 10 seconds">−10</button>
    <button id="toggle">Pause</button>
    <button id="fwd10" aria-label="Forward 10 seconds">+10</button>
    <button id="save">Save</button>
  </div>
</section>

<script>
(() => {
  // ---------- storage helpers (writes can fail on device) ----------
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
  };

  // API key: add ?key=YOUR_KEY to the app URL once; it's remembered after that.
  const urlKey = new URLSearchParams(location.search).get('key');
  if (urlKey) store.set('ytKey', urlKey);
  const API_KEY = urlKey || store.get('ytKey', '');

  const $ = id => document.getElementById(id);
  let saved = store.get('saved', []);
  let results = [];
  let view = 'results';
  let player = null, playerReady = false, pending = null, current = null;

  // ---------- parsing links ----------
  function videoIdFrom(text) {
    const t = text.trim();
    if (/^[\w-]{11}$/.test(t)) return t;
    try {
      const u = new URL(t);
      if (u.hostname.includes('youtu.be')) return u.pathname.slice(1, 12);
      if (u.searchParams.get('v')) return u.searchParams.get('v');
      const m = u.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/);
      if (m) return m[2];
    } catch {}
    return null;
  }

  // ---------- list rendering ----------
  function render() {
    const items = view === 'saved' ? saved : results;
    $('tab-results').setAttribute('aria-pressed', view === 'results');
    $('tab-saved').setAttribute('aria-pressed', view === 'saved');
    const list = $('list');
    list.innerHTML = '';
    if (!items.length) {
      $('status').textContent = view === 'saved'
        ? 'Nothing saved yet. Tap Save while a video plays to keep it here.'
        : (API_KEY ? 'Search above, or paste a YouTube link.' : 'Paste a YouTube link above. To search, add your API key to the app URL.');
      return;
    }
    $('status').textContent = '';
    for (const v of items) {
      const b = document.createElement('button');
      b.className = 'item';
      b.innerHTML = `<img alt="" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg"><span></span>`;
      b.querySelector('span').textContent = v.title;
      b.addEventListener('click', () => openVideo(v));
      list.appendChild(b);
    }
  }

  async function search(q) {
    if (!API_KEY) { $('status').innerHTML = '<span class="msg">Search needs a YouTube API key. Paste a video link instead.</span>'; return; }
    $('status').textContent = 'Searching…';
    try {
      const url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=10'
        + '&q=' + encodeURIComponent(q) + '&key=' + encodeURIComponent(API_KEY);
      const r = await fetch(url);
      if (!r.ok) throw new Error('Search failed (' + r.status + '). Check that your API key is valid.');
      const data = await r.json();
      results = data.items.map(i => ({ id: i.id.videoId, title: decode(i.snippet.title) }));
      view = 'results';
      render();
      if (!results.length) $('status').textContent = 'No videos found. Try different words.';
    } catch (e) {
      $('status').innerHTML = '';
      const s = document.createElement('span'); s.className = 'msg'; s.textContent = e.message;
      $('status').appendChild(s);
    }
  }
  function decode(s) { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }

  // ---------- player ----------
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('yt', {
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 0 },
      events: {
        onReady: () => { playerReady = true; if (pending) { load(pending); pending = null; } },
        onStateChange: e => { $('toggle').textContent = e.data === YT.PlayerState.PLAYING ? 'Pause' : 'Play'; },
        onError: () => { $('now-title').textContent = 'This video can’t play outside YouTube. Go back and pick another.'; }
      }
    });
  };
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  function load(v) { player.loadVideoById(v.id); }

  function showScreen(name) {
    $('home').classList.toggle('active', name === 'home');
    $('player-screen').classList.toggle('active', name === 'player');
  }

  function openVideo(v, fromHistory) {
    current = v;
    $('now-title').textContent = v.title;
    $('save').textContent = saved.some(s => s.id === v.id) ? 'Saved' : 'Save';
    showScreen('player');
    if (!fromHistory) history.pushState({ video: v }, '');
    if (playerReady) load(v); else pending = v;
    $('toggle').focus();
  }

  function closeVideo() {
    if (playerReady) player.stopVideo();
    showScreen('home');
    render();
  }

  // Back gesture on glasses uses browser history.
  addEventListener('popstate', e => {
    if (e.state && e.state.video) openVideo(e.state.video, true); else closeVideo();
  });

  // ---------- controls ----------
  $('toggle').addEventListener('click', () => {
    if (!playerReady) return;
    player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
  });
  $('back10').addEventListener('click', () => playerReady && player.seekTo(Math.max(0, player.getCurrentTime() - 10), true));
  $('fwd10').addEventListener('click', () => playerReady && player.seekTo(player.getCurrentTime() + 10, true));
  $('save').addEventListener('click', () => {
    if (!current) return;
    if (saved.some(s => s.id === current.id)) {
      saved = saved.filter(s => s.id !== current.id);
      $('save').textContent = 'Save';
    } else {
      saved.unshift(current);
      $('save').textContent = 'Saved';
    }
    store.set('saved', saved);
  });

  function submit() {
    const text = $('query').value;
    if (!text.trim()) return;
    const id = videoIdFrom(text);
    if (id) openVideo({ id, title: 'YouTube video' });
    else search(text);
  }
  $('go').addEventListener('click', submit);
  $('query').addEventListener('change', submit);
  $('tab-results').addEventListener('click', () => { view = 'results'; render(); });
  $('tab-saved').addEventListener('click', () => { view = 'saved'; render(); });

  render();
})();
</script>
</body>
</html>
